name: CI/CD Pipeline
on:
  push:
  pull_request:

# Push and PR never run at once, second run queues until the first finishes.
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL_TEST }}
      NODE_ENV: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version-file: .nvmrc
      
      - name: Install dependencies
        working-directory: attendance-manager
        run: npm ci
      
      - name: Generate Prisma Client
        working-directory: attendance-manager
        run: npx prisma generate
      
      - name: Lint
        working-directory: attendance-manager
        run: npm run lint
      
      # Runs every __tests__/**/*.test.ts file (sequentially, see jest.config.js),
      # so new or moved tests are picked up automatically.
      - name: Test
        working-directory: attendance-manager
        run: npm run test