name: CI/CD Pipeline
on:
  push:
  pull_request:

# Push and PR never run at once, second run queues until the first finishes.
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/postgres
      NODE_ENV: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version-file: .nvmrc
      
      - name: Install dependencies
        working-directory: attendance-manager
        run: npm ci
      
      - name: Generate Prisma Client
        working-directory: attendance-manager
        run: npx prisma generate

      - name: Apply database migrations
        working-directory: attendance-manager
        run: npx prisma migrate deploy

      - name: Lint
        working-directory: attendance-manager
        run: npm run lint
      
      # Runs every __tests__/**/*.test.ts file (sequentially, see jest.config.js),
      # so new or moved tests are picked up automatically.
      - name: Test
        working-directory: attendance-manager
        run: npm run test