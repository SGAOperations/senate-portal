name: CI/CD Pipeline
on:
  push:
  pull_request:

# Push and PR never run at once, second run queues until the first finishes.
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/postgres
      NODE_ENV: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version-file: .nvmrc
      
      - name: Install dependencies
        working-directory: attendance-manager
        run: npm ci
      
      - name: Generate Prisma Client
        working-directory: attendance-manager
        run: npx prisma generate

      - name: Apply database migrations
        working-directory: attendance-manager
        run: npx prisma migrate deploy

      - name: Lint
        working-directory: attendance-manager
        run: npm run lint
      
      - name: Test Middleware
        working-directory: attendance-manager
        run: npm run test -- src/middleware/__tests__/middleware.test.ts
      
      - name: Test API Auth Utilities
        working-directory: attendance-manager
        run: npm run test -- src/utils/__tests__/api-auth.test.ts
      
      - name: Test Users
        working-directory: attendance-manager
        run: npm run test -- src/users/__tests__/users.test.ts
      
      - name: Test Meetings
        working-directory: attendance-manager
        run: npm run test -- src/meeting/__tests__/meeting.test.ts
      
      - name: Test Attendance
        working-directory: attendance-manager
        run: npm run test -- src/attendance/__tests__/attendance.test.ts
      
      - name: Test Requests
        working-directory: attendance-manager
        run: npm run test -- src/request/__tests__/request.test.ts
      
      - name: Test Auth Flow
        working-directory: attendance-manager
        run: npm run test -- src/auth/__tests__/auth-flow.test.ts

      - name: Test Voting
        working-directory: attendance-manager
        run: npm run test -- src/voting/__tests__/voting.test.ts
        
      - name: Test Voting Record
        working-directory: attendance-manager
        run: npm run test -- src/voting-record/__tests__/voting-record.test.ts